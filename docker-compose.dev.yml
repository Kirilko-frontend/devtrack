services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: devtrack
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack -d devtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./devtrack-backend
      dockerfile: Dockerfile.dev
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://devtrack:${DB_PASSWORD}@db:5432/devtrack
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./devtrack-backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://devtrack:${DB_PASSWORD}@db:5432/devtrack
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: http://localhost:5173
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - ./devtrack-backend:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./devtrack-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./devtrack-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata_dev:
