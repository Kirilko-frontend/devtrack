services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: devtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack -d devtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./devtrack-backend
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://devtrack:${DB_PASSWORD}@db:5432/devtrack
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./devtrack-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://devtrack:${DB_PASSWORD}@db:5432/devtrack
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./devtrack-frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
